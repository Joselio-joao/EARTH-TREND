<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Como funciona a EarthTrend AI</title>
  <desc id="desc">Fluxo desde a pergunta científica até aos resultados: dados NASA, preparação, análise e comunicação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b26"/><stop offset="1" stop-color="#203748"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#a7e9bf"/><stop offset="1" stop-color="#65c58d"/></linearGradient>
    <linearGradient id="lav" x1="0" x2="1"><stop stop-color="#e6ddff"/><stop offset="1" stop-color="#c3b5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071019" flood-opacity=".18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9eb8c5"/></marker>
  </defs>
  <rect width="1400" height="470" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="40" r="210" fill="#bfaaff" opacity=".10"/><circle cx="140" cy="450" r="230" fill="#69e49c" opacity=".08"/>
  <text x="54" y="55" fill="#a7e9bf" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">EARTH SYSTEM WORKFLOW</text>
  <text x="54" y="88" fill="#e9f1f1" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Da uma pergunta concreta a uma leitura verificável.</text>
  <g filter="url(#shadow)">
    <rect x="54" y="150" width="232" height="190" rx="18" fill="#f8fbfa"/>
    <circle cx="96" cy="193" r="19" fill="#e6f7eb"/><text x="88" y="200" fill="#3b9763" font-family="Arial" font-size="20" font-weight="700">01</text>
    <text x="78" y="244" fill="#17242d" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Pergunta</text>
    <text x="78" y="274" fill="#667771" font-family="Inter,Arial,sans-serif" font-size="13">O que está a mudar?</text><text x="78" y="296" fill="#667771" font-family="Inter,Arial,sans-serif" font-size="13">Onde acontece?</text>
    <rect x="316" y="150" width="232" height="190" rx="18" fill="#e9f3ff"/>
    <circle cx="358" cy="193" r="19" fill="#d7e7ff"/><text x="350" y="200" fill="#4d7abd" font-family="Arial" font-size="20" font-weight="700">02</text>
    <text x="340" y="244" fill="#17242d" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Dados NASA</text>
    <text x="340" y="274" fill="#61758a" font-family="Inter,Arial,sans-serif" font-size="13">GPM IMERG</text><text x="340" y="296" fill="#61758a" font-family="Inter,Arial,sans-serif" font-size="13">Earthdata · unidades</text>
    <rect x="578" y="150" width="232" height="190" rx="18" fill="#e8f7ef"/>
    <circle cx="620" cy="193" r="19" fill="#ccefd9"/><text x="612" y="200" fill="#3b9763" font-family="Arial" font-size="20" font-weight="700">03</text>
    <text x="602" y="244" fill="#17242d" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Preparação</text>
    <text x="602" y="274" fill="#5f796b" font-family="Inter,Arial,sans-serif" font-size="13">Qualidade e gaps</text><text x="602" y="296" fill="#5f796b" font-family="Inter,Arial,sans-serif" font-size="13">escala · sazonalidade</text>
    <rect x="840" y="150" width="232" height="190" rx="18" fill="#f0ebff"/>
    <circle cx="882" cy="193" r="19" fill="#dfd5ff"/><text x="874" y="200" fill="#7561c5" font-family="Arial" font-size="20" font-weight="700">04</text>
    <text x="864" y="244" fill="#17242d" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Tendência</text>
    <text x="864" y="274" fill="#716a88" font-family="Inter,Arial,sans-serif" font-size="13">Mann–Kendall</text><text x="864" y="296" fill="#716a88" font-family="Inter,Arial,sans-serif" font-size="13">Sen’s slope · valor-p</text>
    <rect x="1102" y="150" width="244" height="190" rx="18" fill="url(#mint)"/>
    <circle cx="1144" cy="193" r="19" fill="#d9f8e4"/><text x="1136" y="200" fill="#318a58" font-family="Arial" font-size="20" font-weight="700">05</text>
    <text x="1126" y="244" fill="#12231a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Resultado</text>
    <text x="1126" y="274" fill="#396b50" font-family="Inter,Arial,sans-serif" font-size="13">Mapa · gráfico</text><text x="1126" y="296" fill="#396b50" font-family="Inter,Arial,sans-serif" font-size="13">relatório responsável</text>
  </g>
  <g stroke="#9eb8c5" stroke-width="2" marker-end="url(#arrow)"><path d="M288 245H306"/><path d="M550 245H568"/><path d="M812 245H830"/><path d="M1074 245H1092"/></g>
  <text x="54" y="407" fill="#a8bac3" font-family="Inter,Arial,sans-serif" font-size="12">A aplicação mostra o cálculo, a fonte e as limitações — não apenas o gráfico final.</text>
</svg>
