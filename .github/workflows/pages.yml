name: Deploy EarthTrend AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build React frontend
        run: npm run build --prefix frontend
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      # The artifact listing API can briefly lag behind a successful upload.
      # A short pause prevents deploy-pages from seeing zero artifacts.
      - name: Wait for Pages artifact indexing
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
